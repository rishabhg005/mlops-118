name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_PASSWORD}}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/house-price-prediction:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME}}/house-price-prediction:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME}}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Starting deployment..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME}}/house-price-prediction:latest

            docker stop house-price-prediction || true

            docker rm house-price-prediction || true

            docker run -d \
              --name house-price-prediction \
              -p 8000:8000 \
              --add-host=host.docker.internal:host-gateway \
              -e MLFLOW_TRACKING=http://13.49.17.201:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/house-price-prediction:latest

            sleep 5

            docker ps

            docker logs --tail 50 house-price-prediction

            curl -f http://localhost:8000/health

            echo "Deployment successful!"
            echo "Application: http://${{ secrets.EC2_HOST }}:8000"